# Checks that the DEEPSEEK_API_KEY secret works: one tiny JSON-mode chat request.
# Runs on demand (Actions → DeepSeek smoke test → Run workflow) and when this file changes.
# The key is never printed; GitHub also masks it in logs.
name: DeepSeek smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/deepseek-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MODEL: deepseek-chat
    steps:
      - name: The secret is set
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is set"

      - name: DeepSeek answers in JSON mode
        run: |
          body=$(jq -n --arg model "$MODEL" '{
            model: $model,
            response_format: { type: "json_object" },
            max_tokens: 50,
            temperature: 0,
            messages: [
              { role: "system", content: "Reply with json only." },
              { role: "user", content: "Return exactly {\"ok\": true} as json." }
            ]
          }')
          status=$(curl -sS -o response.json -w '%{http_code}' \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::DeepSeek returned HTTP $status: $(jq -r '.error.message // "no message"' response.json)"
            exit 1
          fi
          echo "model: $(jq -r '.model' response.json)"
          echo "tokens: $(jq -r '.usage.total_tokens' response.json)"
          jq -e '.choices[0].message.content | fromjson | .ok == true' response.json
