# PostgreSQL in Docker (docker compose up -d postgres). Override with environment variables.
spring.datasource.url=${FSI_DB_URL:jdbc:postgresql://localhost:5432/fsieng}
spring.datasource.username=${FSI_DB_USER:fsieng}
spring.datasource.password=${FSI_DB_PASSWORD:fsieng-dev}

# Load content/ into the database at startup.
fsi.content.import-on-startup=true
fsi.content.dir=${FSI_CONTENT_DIR:../content}
