spring.application.name=fsi-eng
# No lazy loading from controllers: map entities to domain objects inside the persistence adapter.
spring.jpa.open-in-view=false
# Dev and tests use in-memory H2. The production database is still to be chosen.
spring.datasource.url=jdbc:h2:mem:fsieng;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
