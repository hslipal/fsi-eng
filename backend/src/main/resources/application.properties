spring.application.name=fsi-eng
# No lazy loading from controllers: map entities to domain objects inside the persistence adapter.
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Default profile: in-memory H2 in PostgreSQL mode (unit/integration tests, CI e2e).
# Use the "postgres" profile for the Docker PostgreSQL database.
spring.datasource.url=jdbc:h2:mem:fsieng;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
# DeepSeek (assessment). The key comes from the environment, never from a committed file.
fsi.deepseek.api-key=${DEEPSEEK_API_KEY:}
# Speaking recordings: DeepSeek speech-to-text accepts at most 8 MiB.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
