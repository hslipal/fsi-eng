# The whole app on Docker Desktop.
#
#   docker compose up -d                 PostgreSQL + backend + frontend → http://localhost:5173
#   docker compose logs -f backend       watch the backend start (first start compiles, ~2-4 min)
#   docker compose restart backend       pick up backend code changes
#   docker compose down                  stop (data stays in the pgdata volume)
#
#   docker compose up -d postgres        database only (e.g. for ./scripts/verify.sh)
#   ./scripts/mvn.sh -B verify           Maven + JDK 25 in a container (used by verify.sh)
#
# The backend runs with profiles postgres,dev: it imports content/ AND the dev-only content-dev/
# at startup. Local development only. Passwords below are for local use; put real values and
# DEEPSEEK_API_KEY in a git-ignored .env file next to this one.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fsieng
      POSTGRES_USER: ${FSI_DB_USER:-fsieng}
      POSTGRES_PASSWORD: ${FSI_DB_PASSWORD:-fsieng-dev}
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FSI_DB_USER:-fsieng} -d fsieng']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace/backend
    # Running the site needs no tests: maven.test.skip skips compiling them, which is slow on a
    # Windows folder mounted into Docker. `./scripts/verify.sh backend` and CI still run them.
    command:
      [
        'mvn',
        '-B',
        '-ntp',
        '-Dmaven.test.skip=true',
        'spring-boot:run',
        '-Dspring-boot.run.profiles=postgres,dev',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/workspace
      - m2:/root/.m2
    ports:
      - '8080:8080'
    environment:
      FSI_DB_URL: jdbc:postgresql://postgres:5432/fsieng
      FSI_DB_USER: ${FSI_DB_USER:-fsieng}
      FSI_DB_PASSWORD: ${FSI_DB_PASSWORD:-fsieng-dev}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  frontend:
    image: node:22
    working_dir: /workspace/frontend
    command: ['sh', '-c', 'npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173']
    depends_on:
      - backend
    volumes:
      - ./:/workspace
      # Linux packages for the container; never mixed with the Windows node_modules on the host.
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - '5173:5173'
    environment:
      API_TARGET: http://backend:8080
      # File changes on a Windows folder do not reach the container as events; poll instead.
      WATCH_POLL: '1'

  maven:
    image: maven:3.9-eclipse-temurin-25
    profiles: ['tools']
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
      - m2:/root/.m2
    # Published only with `run --service-ports`; do not combine with the backend service.
    ports:
      - '8080:8080'
    environment:
      FSI_DB_URL: jdbc:postgresql://postgres:5432/fsieng
      FSI_DB_USER: ${FSI_DB_USER:-fsieng}
      FSI_DB_PASSWORD: ${FSI_DB_PASSWORD:-fsieng-dev}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

volumes:
  pgdata:
  m2:
  frontend_node_modules:
